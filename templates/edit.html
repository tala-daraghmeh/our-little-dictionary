<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Word</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>

<body>
    <div class="book">

        <div class="book-cover">
            <h1>Our Little Dictionary</h1>
            <p>In the club we all fam</p>
            <a href="/words">Back to Dictionary</a>
        </div>

        <div class="dictionary-pages">

            <h1>Edit brrrooooooooooooooo ✏️</h1>

            <form action="/edit/{{ word[0] }}" method="POST" class="add-form">
                <input type="text" name="word" value="{{ word[1] }}" required>
                <textarea name="note">{{ word[2] }}</textarea>
                <button type="submit">Save</button>
            </form>

        </div>
    </div>
</body>
</html>
