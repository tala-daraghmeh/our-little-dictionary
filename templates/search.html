<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>

<body>
    <div class="book">

        <div class="book-cover">
            <h1>Our Little Dictionary</h1>
            <p>In the club we all fam</p>
            <a href="/">Add a new word</a>
        </div>

        <div class="dictionary-pages">

            <h1>نتائج البحث عن "{{ query }}" 🔍</h1>

            {% for word in words %}
                <div class="word-page">
                    <h2>{{ word[1] }}</h2>
                    <p>{{ word[2] }}</p>

                    <div class="word-actions">
                        <a href="/edit/{{ word[0] }}">Edit</a>

                        <form action="/delete/{{ word[0] }}" method="POST">
                            <button type="submit">Delete</button>
                        </form>
                    </div>
                </div>
            {% else %}
                <div class="word-page">
                    <h2>ولكك مفش اشي 😅</h2>
                    <p>طيب عيدي عيدي</p>
                </div>
            {% endfor %}

            <div class="word-actions" style="margin-top: 20px;">
                <a href="/words">← Back to Dictionary</a>
            </div>

        </div>
    </div>
</body>
</html>
